<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <title>Meu Site no Ar</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
            text-align: center;
        }
        header {
            padding: 40px 0;
            background: #222;
        }
        h1 {
            font-size: 40px;
            margin: 0;
        }
        p {
            font-size: 18px;

    <header>
        <h1>Site no Ar com GitHub Pages</h1>

    <div class="container">

        <button onclick="alert('Seu site está funcionando!')">Clique aqui</button>
